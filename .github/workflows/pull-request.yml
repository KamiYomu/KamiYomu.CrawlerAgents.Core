name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Pull Request

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/KamiYomu.CrawlerAgents.Core.sln

      - name: Build solution
        run: dotnet build ./src/KamiYomu.CrawlerAgents.Core.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ./src/KamiYomu.CrawlerAgents.Core.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Check code formatting
        run: dotnet format --workspace ./src/KamiYomu.CrawlerAgents.Core.sln --verify-no-changes --verbosity diagnostic

      - name: Check for security vulnerabilities
        run: dotnet list ./src/KamiYomu.CrawlerAgents.Core.sln package --vulnerable